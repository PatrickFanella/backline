version: 2
# Ready pull requests in this repository merge themselves once Mirror CI passes,
# and a merge to main may deploy. Every entry therefore ignores major versions,
# groups minor and patch updates into one pull request and keeps at most one
# pull request open.
updates:
  # Backend dependencies. Version updates are switched off (limit 0): the
  # native deploy on main refuses a changed backend/package.json and applies
  # only the reviewed modules listed in scripts/ci/prepare-runtime-patch.py,
  # so backend dependency changes go through the native release process.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Documentation site and repository tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tooling-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
