name: Backend CI

on:
    push:
        paths:
            - 'backend/**'
            - 'scripts/check-postgresql-baseline.mjs'
            - 'scripts/adopt-postgresql-baseline.mjs'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'backend/**'
            - 'scripts/check-postgresql-baseline.mjs'
            - 'scripts/adopt-postgresql-baseline.mjs'
            - '.github/workflows/**'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

    typecheck:
        name: TypeScript Check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run TypeScript check
              run: npm run type-check

    prisma:
        name: Prisma Validation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Validate Prisma schema
              run: npm run prisma:validate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Generate Prisma client
              run: npm run prisma:generate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

    database-integration:
        name: PostgreSQL migrations and integration suite
        runs-on: ubuntu-latest
        env:
            PG_CONTAINER: backline-ci-postgres-${{ github.run_id }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Generate Prisma client
              working-directory: backend
              run: npm run prisma:generate

            - name: Start an isolated PostgreSQL container
              run: |
                  docker run -d --name "$PG_CONTAINER" \
                    -e POSTGRES_USER=spywatcher -e POSTGRES_PASSWORD=test_password \
                    -e POSTGRES_DB=spywatcher_test postgres:16
                  for attempt in $(seq 1 30); do
                    if docker exec "$PG_CONTAINER" pg_isready -U spywatcher; then
                      break
                    fi
                    sleep 1
                  done
                  docker exec "$PG_CONTAINER" pg_isready -U spywatcher
                  pg_host="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$PG_CONTAINER")"
                  test -n "$pg_host"
                  echo "BASELINE_FRESH_DATABASE_URL=postgresql://spywatcher:test_password@$pg_host:5432/spywatcher_test" >> "$GITHUB_ENV"
                  echo "BASELINE_EXISTING_DATABASE_URL=postgresql://spywatcher:test_password@$pg_host:5432/spywatcher_existing" >> "$GITHUB_ENV"
                  echo "DATABASE_URL=postgresql://spywatcher:test_password@$pg_host:5432/spywatcher_integration" >> "$GITHUB_ENV"

            - name: Check fresh and existing PostgreSQL baselines
              run: |
                  docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_existing
                  node scripts/check-postgresql-baseline.mjs

            - name: Create a fresh integration database
              run: docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_integration

            - name: Apply every migration to the integration database
              working-directory: backend
              run: npm run prisma:migrate

            - name: Run every PostgreSQL integration suite
              working-directory: backend
              env:
                  RUN_DATABASE_TESTS: 'true'
              run: npm test -- --runInBand __tests__/integration/database

            - name: Remove the disposable PostgreSQL container
              if: always()
              run: docker rm -f "$PG_CONTAINER"

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, typecheck, prisma, test, database-integration]
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npm run prisma:generate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Build
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              # Gitea's artifact service currently times out while finalizing this
              # otherwise successful build. Keep the build gate on Gitea; retain
              # artifact publishing for GitHub until the Gitea service is repaired.
              if: github.server_url == 'https://github.com'
              with:
                  name: backend-dist
                  path: backend/dist
                  retention-days: 7
                  if-no-files-found: error
