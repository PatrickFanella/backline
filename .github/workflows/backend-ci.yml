name: Backend CI

on:
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - 'scripts/check-postgresql-baseline.mjs'
            - 'scripts/adopt-postgresql-baseline.mjs'
            - 'scripts/ci/**'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'backend/**'
            - 'scripts/check-postgresql-baseline.mjs'
            - 'scripts/adopt-postgresql-baseline.mjs'
            - 'scripts/ci/**'
            - '.github/workflows/**'

permissions:
  contents: read

jobs:
    quality:
        name: Lint, types, schema and build
        timeout-minutes: 30
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run TypeScript check
              run: npm run type-check

            - name: Validate Prisma schema
              run: npm run prisma:validate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Generate Prisma client
              run: npm run prisma:generate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Build
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              # Gitea's artifact service currently times out while finalizing this
              # otherwise successful build. Keep the build gate on Gitea; retain
              # artifact publishing for GitHub until the Gitea service is repaired.
              if: github.server_url == 'https://github.com'
              with:
                  name: backend-dist
                  path: backend/dist
                  retention-days: 7
                  if-no-files-found: error

    database-integration:
        name: PostgreSQL migrations and integration suite
        timeout-minutes: 30
        runs-on: ubuntu-latest
        env:
            PG_CONTAINER: backline-ci-postgres-${{ github.run_id }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Generate Prisma client
              working-directory: backend
              run: npm run prisma:generate

            - name: Start an isolated PostgreSQL container
              run: |
                  if docker inspect --type container "$HOSTNAME" >/dev/null 2>&1; then
                    # Gitea jobs may use a different bridge from Docker's default.
                    # Sharing this job's namespace keeps the database on loopback.
                    network_args=(--network "container:$HOSTNAME")
                    pg_port=5432
                  else
                    # A host-based runner uses an ephemeral loopback-only port.
                    network_args=(-p 127.0.0.1::5432)
                    pg_port=""
                  fi
                  docker run -d --name "$PG_CONTAINER" "${network_args[@]}" \
                    -e POSTGRES_USER=spywatcher -e POSTGRES_PASSWORD=test_password \
                    -e POSTGRES_DB=spywatcher_test postgres:16
                  for attempt in $(seq 1 30); do
                    if docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U spywatcher; then
                      break
                    fi
                    sleep 1
                  done
                  docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U spywatcher
                  if [ -z "$pg_port" ]; then
                    binding="$(docker port "$PG_CONTAINER" 5432/tcp)"
                    pg_port="${binding##*:}"
                  fi
                  [[ "$pg_port" =~ ^[0-9]+$ ]]
                  echo "BASELINE_FRESH_DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_test" >> "$GITHUB_ENV"
                  echo "BASELINE_EXISTING_DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_existing" >> "$GITHUB_ENV"
                  echo "DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_integration" >> "$GITHUB_ENV"

            - name: Check fresh and existing PostgreSQL baselines
              run: |
                  docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_existing
                  node scripts/check-postgresql-baseline.mjs

            - name: Create a fresh integration database
              run: docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_integration

            - name: Apply every migration to the integration database
              working-directory: backend
              run: npm run prisma:migrate

            - name: Run every PostgreSQL integration suite
              working-directory: backend
              env:
                  RUN_DATABASE_TESTS: 'true'
              run: npm test -- --runInBand __tests__/integration/database

            - name: Remove the disposable PostgreSQL container
              if: always()
              run: docker rm -f "$PG_CONTAINER"

    native-runtime-candidate:
        name: Native runtime dependency candidate
        needs: [quality, database-integration]
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Test package integrity and source admission
              run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

            - name: Package exact lockfile dependencies
              run: python3 scripts/ci/prepare-runtime-patch.py

            - name: Qualify the immutable transport image
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: |
                  image="local/backline-runtime-candidate:$SOURCE_REVISION"
                  container="backline-runtime-candidate-${{ github.run_id }}"
                  extracted="$(mktemp -d)"
                  trap 'docker rm -f "$container" >/dev/null 2>&1; rm -rf "$extracted"' EXIT
                  docker build -f scripts/ci/runtime-patch.Dockerfile \
                    --build-arg SOURCE_REVISION="$SOURCE_REVISION" --tag "$image" .
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_REVISION"
                  docker create --name "$container" "$image" /candidate
                  docker cp "$container:/payload/." "$extracted/"
                  diff -r .ci-runtime-patch "$extracted"
                  mkdir runtime-candidate-artifacts
                  cp .ci-runtime-patch/manifest.json runtime-candidate-artifacts/
                  docker save --output runtime-candidate-artifacts/image.tar "$image"
                  sha256sum runtime-candidate-artifacts/image.tar

            - name: Retain the source-bound dependency candidate
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              with:
                  name: native-runtime-candidate-${{ github.sha }}
                  path: runtime-candidate-artifacts/
                  retention-days: 7
                  if-no-files-found: error
