name: Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: ./backend

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run backend tests with coverage
              run: npm run test:coverage -- --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcovonly
              env:
                  JWT_SECRET: test-jwt-secret-key-12345678
                  JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-12345678
                  DISCORD_CLIENT_ID: test-client-id
                  DISCORD_CLIENT_SECRET: test-client-secret
                  DISCORD_REDIRECT_URI: http://localhost:3000/auth/callback
                  DISCORD_BOT_TOKEN: test-bot-token
                  DISCORD_GUILD_ID: test-guild-id
                  ADMIN_DISCORD_IDS: 123456789,987654321
                  FRONTEND_URL: http://localhost:5173

            - name: Upload backend coverage artifact
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              continue-on-error: true
              with:
                  name: backend-coverage
                  path: |
                      backend/coverage/lcov.info
                      backend/coverage/coverage-summary.json
                  retention-days: 14
                  if-no-files-found: error

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npm run test:e2e
              env:
                  VITE_API_URL: http://localhost:3001/api
                  VITE_DISCORD_CLIENT_ID: '1375864689577164911'

            - name: Upload Playwright Report
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              continue-on-error: true
              if: always()
              with:
                  name: playwright-report
                  path: frontend/playwright-report/
                  retention-days: 30
