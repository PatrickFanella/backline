name: Security qualification

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '0 2 * * *'

jobs:
    codeql-github-only:
        name: CodeQL analysis (GitHub only)
        # CodeQL uploads results to GitHub's Security API. Gitea has no compatible endpoint.
        # On Gitea this job is deliberately skipped; it is not a completed CodeQL scan.
        if: github.server_url == 'https://github.com'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  queries: security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@v4

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: /language:javascript-typescript

    dependency-audit-backend:
        name: Backend dependency audit
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Fail on high or critical production dependency vulnerabilities
              run: npm audit --omit=dev --audit-level=high

    dependency-audit-frontend:
        name: Frontend dependency audit
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Fail on high or critical production dependency vulnerabilities
              run: npm audit --omit=dev --audit-level=high

    secrets-scan:
        name: Verified secrets scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout complete history
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Scan event history for verified secrets
              # Omitted refs use push before/after or pull-request base/head.
              # Scheduled runs scan history; explicit equal refs would fail.
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  extra_args: --only-verified
