name: Frontend CI

# This job owns frontend tests formerly duplicated in tests.yml, so retain
# their all-PR/main applicability rather than narrow coverage by path.
on:
    push:
        branches: [main]
    pull_request:

permissions:
  contents: read

jobs:
    quality:
        name: Frontend quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Run ESLint
              run: npm run lint
            - name: Run TypeScript check
              run: npm run type-check
            - name: Run frontend tests with coverage
              run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=lcov
            - name: Upload frontend coverage artifact
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              continue-on-error: true
              with:
                  name: frontend-coverage
                  path: |
                      frontend/coverage/lcov.info
                      frontend/coverage/coverage-summary.json
                  retention-days: 14
                  if-no-files-found: error
            - name: Build
              run: npm run build
              env:
                  VITE_DISCORD_CLIENT_ID: '123456789012345678'
            - name: Upload build artifacts
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              with:
                  name: frontend-dist
                  path: frontend/dist
                  retention-days: 7
                  if-no-files-found: error
