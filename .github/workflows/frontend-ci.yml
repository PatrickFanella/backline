name: Frontend CI

on:
    push:
        paths:
            - 'frontend/**'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'frontend/**'
            - '.github/workflows/**'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: TypeScript Check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run TypeScript check
              run: npm run type-check

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, typecheck, test]
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  VITE_DISCORD_CLIENT_ID: '123456789012345678'

            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              with:
                  name: frontend-dist
                  path: frontend/dist
                  retention-days: 7
                  if-no-files-found: error
