name: Backend CI

on:
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - 'frontend/**'
            - 'scripts/check-postgresql-baseline.mjs'
            - 'scripts/adopt-postgresql-baseline.mjs'
            - 'scripts/ci/**'
            - '.gitea/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        name: Lint, types, schema and build
        timeout-minutes: 30
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run TypeScript check
              run: npm run type-check

            - name: Validate Prisma schema
              run: npm run prisma:validate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Generate Prisma client
              run: npm run prisma:generate
              env:
                  DATABASE_URL: 'postgresql://spywatcher:test_password@localhost:5432/spywatcher_test'

            - name: Build
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              # Gitea's artifact service currently times out while finalizing this
              # otherwise successful build. Keep the build gate on Gitea; retain
              # artifact publishing for GitHub until the Gitea service is repaired.
              if: github.server_url == 'https://github.com'
              with:
                  name: backend-dist
                  path: backend/dist
                  retention-days: 7
                  if-no-files-found: error

    native-runtime:
        name: Qualify and deploy native dependencies
        needs: [native-runtime-candidate]
        timeout-minutes: 25
        # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
        runs-on: [ubuntu-latest, kvant]
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Package the exact native dependencies
              run: python3 scripts/ci/prepare-runtime-patch.py

            - name: Build and compare the transport payload
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: |
                  image="fleet-deploy/backline-native/runtime:$SOURCE_REVISION"
                  container="backline-native-${{ github.run_id }}"
                  extracted="$(mktemp -d)"
                  trap 'docker rm -f "$container" >/dev/null 2>&1; rm -rf "$extracted"' EXIT
                  docker build -f scripts/ci/runtime-patch.Dockerfile \
                    --build-arg SOURCE_REVISION="$SOURCE_REVISION" --tag "$image" .
                  docker create --name "$container" "$image" /candidate
                  docker cp "$container:/payload/." "$extracted/"
                  diff -r .ci-runtime-patch "$extracted"

            - name: Admit and activate the native dependency update
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.subcult.tv'
              env:
                  SOURCE_REVISION: ${{ github.sha }}
                  DEPLOY_KEY: ${{ secrets.HOMELAB_NATIVE_DEPLOY_KEY }}
                  KNOWN_HOSTS: ${{ secrets.HOMELAB_NATIVE_KNOWN_HOSTS }}
              run: |
                  umask 077
                  [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
                  ssh_directory="$(mktemp -d)"
                  trap 'rm -rf "$ssh_directory"' EXIT
                  printf '%s\n' "$DEPLOY_KEY" > "$ssh_directory/key"
                  printf '%s\n' "$KNOWN_HOSTS" > "$ssh_directory/known_hosts"
                  options=(-i "$ssh_directory/key" -o BatchMode=yes -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_directory/known_hosts")
                  # The forced command accepts fixed verbs and this validated client-side SHA.
                  # shellcheck disable=SC2029
                  accepted="$(ssh "${options[@]}" onnwee@10.0.0.57 "artifact $SOURCE_REVISION runtime")"
                  if ! python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1])["available"] else 1)' "$accepted"; then
                    # shellcheck disable=SC2029
                    docker save "fleet-deploy/backline-native/runtime:$SOURCE_REVISION" | \
                      ssh "${options[@]}" onnwee@10.0.0.57 "receive $SOURCE_REVISION runtime"
                  fi
                  # shellcheck disable=SC2029
                  ssh "${options[@]}" onnwee@10.0.0.57 "deploy $SOURCE_REVISION"

    dashboard:
        name: Dashboard image
        needs: [native-runtime]
        timeout-minutes: 20
        # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
        runs-on: [ubuntu-latest, kvant]
        steps:
            - name: Checkout source
              uses: actions/checkout@v5
            - name: Build the production-configured dashboard
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: |
                  docker build --file frontend/Dockerfile \
                    --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
                    --build-arg VITE_DISCORD_CLIENT_ID=1375864689577164911 \
                    --build-arg VITE_API_URL=/api --build-arg VITE_ENVIRONMENT=production \
                    --build-arg VITE_DISCORD_REDIRECT_URI=https://backline.subcult.tv/auth/callback \
                    --tag "fleet-deploy/backline-web/web:$SOURCE_REVISION" frontend
            - name: Verify image bytes, metadata and privacy
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: python3 scripts/ci/qualify-web.py "fleet-deploy/backline-web/web:$SOURCE_REVISION" "$SOURCE_REVISION"
            - name: Promote the current main dashboard
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.subcult.tv'
              env:
                  SOURCE_REVISION: ${{ github.sha }}
                  DEPLOY_KEY: ${{ secrets.HOMELAB_WEB_DEPLOY_KEY }}
                  KNOWN_HOSTS: ${{ secrets.HOMELAB_WEB_KNOWN_HOSTS }}
              run: |
                  umask 077
                  [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
                  ssh_directory="$(mktemp -d)"
                  trap 'rm -rf "$ssh_directory"' EXIT
                  printf '%s\n' "$DEPLOY_KEY" > "$ssh_directory/key"
                  printf '%s\n' "$KNOWN_HOSTS" > "$ssh_directory/known_hosts"
                  options=(-i "$ssh_directory/key" -o BatchMode=yes -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_directory/known_hosts")
                  # Fixed verbs and the validated SHA expand on the client.
                  # shellcheck disable=SC2029
                  accepted="$(ssh "${options[@]}" onnwee@10.0.0.57 "artifact $SOURCE_REVISION web")"
                  if ! python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1])["available"] else 1)' "$accepted"; then
                    # shellcheck disable=SC2029
                    docker save "fleet-deploy/backline-web/web:$SOURCE_REVISION" | \
                      ssh "${options[@]}" onnwee@10.0.0.57 "receive $SOURCE_REVISION web"
                  fi
                  ready=0
                  for attempt in $(seq 1 60); do
                    if status="$(ssh "${options[@]}" onnwee@10.0.0.57 status)"; then
                      if python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1])["compose_ready"] else 1)' "$status"; then
                        ready=1
                        break
                      fi
                    fi
                    echo "Waiting for the registered dashboard Compose baseline ($attempt/60)."
                    sleep 5
                  done
                  test "$ready" = 1
                  # shellcheck disable=SC2029
                  ssh "${options[@]}" onnwee@10.0.0.57 "deploy $SOURCE_REVISION"

    database-integration:
        name: PostgreSQL migrations and integration suite
        timeout-minutes: 30
        runs-on: ubuntu-latest
        env:
            PG_CONTAINER: backline-ci-postgres-${{ github.run_id }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Generate Prisma client
              working-directory: backend
              run: npm run prisma:generate

            - name: Start an isolated PostgreSQL container
              run: |
                  if docker inspect --type container "$HOSTNAME" >/dev/null 2>&1; then
                    # Gitea jobs may use a different bridge from Docker's default.
                    # Sharing this job's namespace keeps the database on loopback.
                    network_args=(--network "container:$HOSTNAME")
                    pg_port=5432
                  else
                    # A host-based runner uses an ephemeral loopback-only port.
                    network_args=(-p 127.0.0.1::5432)
                    pg_port=""
                  fi
                  docker run -d --name "$PG_CONTAINER" "${network_args[@]}" \
                    -e POSTGRES_USER=spywatcher -e POSTGRES_PASSWORD=test_password \
                    -e POSTGRES_DB=spywatcher_test postgres:16
                  for attempt in $(seq 1 30); do
                    if docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U spywatcher; then
                      break
                    fi
                    sleep 1
                  done
                  docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U spywatcher
                  if [ -z "$pg_port" ]; then
                    binding="$(docker port "$PG_CONTAINER" 5432/tcp)"
                    pg_port="${binding##*:}"
                  fi
                  [[ "$pg_port" =~ ^[0-9]+$ ]]
                  echo "BASELINE_FRESH_DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_test" >> "$GITHUB_ENV"
                  echo "BASELINE_EXISTING_DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_existing" >> "$GITHUB_ENV"
                  echo "DATABASE_URL=postgresql://spywatcher:test_password@127.0.0.1:$pg_port/spywatcher_integration" >> "$GITHUB_ENV"

            - name: Check fresh and existing PostgreSQL baselines
              run: |
                  docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_existing
                  node scripts/check-postgresql-baseline.mjs

            - name: Create a fresh integration database
              run: docker exec "$PG_CONTAINER" createdb -U spywatcher spywatcher_integration

            - name: Apply every migration to the integration database
              working-directory: backend
              run: npm run prisma:migrate

            - name: Run every PostgreSQL integration suite
              working-directory: backend
              env:
                  RUN_DATABASE_TESTS: 'true'
              run: npm test -- --runInBand __tests__/integration/database

            - name: Remove the disposable PostgreSQL container
              if: always()
              run: docker rm -f "$PG_CONTAINER"

    native-runtime-candidate:
        name: Native runtime dependency candidate
        needs: [quality, database-integration]
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Test package integrity and source admission
              run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

            - name: Package exact lockfile dependencies
              run: python3 scripts/ci/prepare-runtime-patch.py

            - name: Qualify the immutable transport image
              env:
                  SOURCE_REVISION: ${{ github.sha }}
              run: |
                  image="local/backline-runtime-candidate:$SOURCE_REVISION"
                  container="backline-runtime-candidate-${{ github.run_id }}"
                  extracted="$(mktemp -d)"
                  trap 'docker rm -f "$container" >/dev/null 2>&1; rm -rf "$extracted"' EXIT
                  docker build -f scripts/ci/runtime-patch.Dockerfile \
                    --build-arg SOURCE_REVISION="$SOURCE_REVISION" --tag "$image" .
                  test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_REVISION"
                  docker create --name "$container" "$image" /candidate
                  docker cp "$container:/payload/." "$extracted/"
                  diff -r .ci-runtime-patch "$extracted"
                  mkdir runtime-candidate-artifacts
                  cp .ci-runtime-patch/manifest.json runtime-candidate-artifacts/
                  docker save --output runtime-candidate-artifacts/image.tar "$image"
                  sha256sum runtime-candidate-artifacts/image.tar

            - name: Retain the source-bound dependency candidate
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              timeout-minutes: 2
              with:
                  name: native-runtime-candidate-${{ github.sha }}
                  path: runtime-candidate-artifacts/
                  retention-days: 7
                  if-no-files-found: error
